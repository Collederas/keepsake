<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d14">
  <title>Keepsake</title>
  <meta name="description" content="One real-life challenge a day. Every one you complete becomes a collectible card in the book of your life.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="screen-today" class="screen active" aria-label="Today"></section>
    <section id="screen-deck" class="screen" aria-label="Deck"></section>
    <section id="screen-book" class="screen" aria-label="Book"></section>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab active" data-screen="today"><span class="tab-ico">☀︎</span>Today</button>
    <button class="tab" data-screen="deck"><span class="tab-ico">☰</span>Deck</button>
    <button class="tab" data-screen="book"><span class="tab-ico">❖</span>Book</button>
  </nav>

  <!-- Proof sheet -->
  <div id="proof" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="proof-title">
      <button class="sheet-close" data-close aria-label="Close">✕</button>
      <p class="eyebrow">Seal it in your book</p>
      <h2 id="proof-title" class="proof-title"></h2>
      <label class="photo-drop" id="photo-drop">
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
        <span class="photo-empty"><span class="photo-plus">＋</span>Add a photo of the moment</span>
        <img id="photo-preview" alt="" hidden>
      </label>
      <label class="field">
        <span>What happened? One line.</span>
        <input id="story-input" maxlength="120" placeholder="My voice cracked on line two. They clapped anyway." autocomplete="off">
      </label>
      <label class="field">
        <span>Where? <em>(optional)</em></span>
        <input id="place-input" maxlength="40" placeholder="Café Lux, Lisbon" autocomplete="off">
      </label>
      <label class="check" id="easier-row">
        <input type="checkbox" id="easier-input">
        <span>I did the easier version <em>(card drops one rarity lower)</em></span>
      </label>
      <button class="btn primary big" id="seal-btn" disabled>Reveal my card</button>
    </div>
  </div>

  <!-- Reveal / viewer overlay -->
  <div id="stage" class="stage" hidden>
    <canvas id="fx"></canvas>
    <div class="rays"></div>
    <div class="stage-inner">
      <p class="stage-hint" id="stage-hint">Tap to reveal</p>
      <div id="stage-card-slot"></div>
      <p class="rarity-banner" id="rarity-banner"></p>
      <div class="stage-actions" id="stage-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
