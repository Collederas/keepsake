<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110f0d">
  <title>Keepsake</title>
  <meta name="description" content="Real-life challenges at your own pace. Every one you complete becomes a card in the book of your life.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keepsake">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;0,7..72,900;1,7..72,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></symbol>
    <symbol id="i-deck" viewBox="0 0 24 24"><rect x="7" y="3.5" width="12" height="16" rx="2"/><path d="M4.5 7v11.5a2 2 0 0 0 2 2H15"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 4.8 7 4.3 3.5 4.5v14c3.5-.2 6.5.3 8.5 2 2-1.7 5-2.2 8.5-2v-14c-3.5-.2-6.5.3-8.5 2Z"/><path d="M12 6.5v14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4.5 9h13l-3.5-3.5M19.5 15h-13l3.5 3.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V20h14v-7.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path d="M12 14.5v2.5"/></symbol>
    <symbol id="i-seal" viewBox="0 0 24 24"><path d="M12 3.5l2.1 5.9 5.9 2.6-5.9 2.6L12 20.5l-2.1-5.9L4 12l5.9-2.6z"/></symbol>
  </svg>

  <main id="app">
    <section id="screen-today" class="screen active" aria-label="Today"></section>
    <section id="screen-deck" class="screen" aria-label="Deck"></section>
    <section id="screen-book" class="screen" aria-label="Book"></section>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab active" data-screen="today" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg>Today</button>
    <button class="tab" data-screen="deck"><svg class="ico" aria-hidden="true"><use href="#i-deck"/></svg>Deck</button>
    <button class="tab" data-screen="book"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg>Book</button>
  </nav>

  <!-- Proof sheet: seal a new card, or edit an existing one -->
  <div id="proof" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="proof-title">
      <button class="icon-btn sheet-close" data-close aria-label="Close"><svg class="ico"><use href="#i-close"/></svg></button>
      <h2 id="proof-title" class="proof-title"></h2>
      <p class="proof-easy" id="proof-easy" hidden>Easy version</p>
      <div class="proof-top">
        <div class="preview-slot" id="preview-slot" aria-hidden="true"></div>
        <div class="proof-photo">
          <input type="file" id="photo-input" accept="image/*" hidden>
          <button type="button" class="photo-btn" id="photo-btn">
            <svg class="ico"><use href="#i-camera"/></svg>
            <span id="photo-btn-label">Add a photo</span>
          </button>
          <p class="hint">A snap from the moment. Or skip it and just write a line.</p>
        </div>
      </div>
      <label class="field">
        <span class="field-label">What happened?</span>
        <textarea id="story-input" rows="2" maxlength="120" placeholder="e.g. My voice cracked on line two. They clapped anyway."></textarea>
        <span class="counter" id="story-count" aria-live="polite">0 / 120</span>
      </label>
      <label class="field">
        <span class="field-label">Where? <span class="opt">Optional</span></span>
        <input id="place-input" maxlength="40" placeholder="e.g. Café Lux, Lisbon" autocomplete="off">
      </label>
      <label class="check" id="upgrade-row">
        <input type="checkbox" id="upgrade-input">
        <span>I did the full challenge after all</span>
      </label>
      <button class="btn primary big" id="seal-btn" disabled>Make my card</button>
      <p class="hint center" id="seal-hint">Add a photo or a line first.</p>
    </div>
  </div>

  <!-- Reveal / viewer overlay -->
  <div id="stage" class="stage" role="dialog" aria-modal="true" aria-label="Your card" hidden>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="rays" aria-hidden="true"></div>
    <button class="icon-btn sound-btn" id="sound-btn" aria-pressed="true" aria-label="Sound"><svg class="ico"><use href="#i-sound"/></svg></button>
    <div class="stage-inner">
      <p class="stage-hint" id="stage-hint"></p>
      <div id="stage-card-slot"></div>
      <p class="rarity-banner" id="rarity-banner" aria-hidden="true"></p>
      <div class="stage-actions" id="stage-actions"></div>
    </div>
  </div>

  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
